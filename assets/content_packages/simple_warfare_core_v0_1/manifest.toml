id = "simple_warfare:core"
title = "Simple Warfare Core"
version = "0.1.0"
schema_version = 1
package_kind = "schema_target"
authors = ["Simple Warfare Team"]

[package]
description = "第一版可长期维护的 Simple Warfare 玩法包创作目标。"
default_locale = "en_us"
entry_map = "simple_warfare:map.duel_fields"
default_faction = "simple_warfare:faction.human"

[entrypoints]
schema = "schema/package_schema.toml"
assets = "registry/assets.toml"
gameplay = "registry/gameplay.toml"
maps = "registry/maps.toml"

[validation]
required_passes = [
  "unique_ids",
  "reference_integrity",
  "template_expansion",
  "production_graph",
  "action_effect_contracts",
  "terrain_layer_dimensions",
  "terrain_tile_reference_integrity",
  "pathing_layer_coverage",
  "map_spawn_rules",
  "asset_existence",
]

[dependencies]
