# Asset Catalog Example
# Place this file at: data/assets/catalog.toml

[atlases.units]
texture = "simple_warfare:texture.units"
pivot_x = 0.5
pivot_y = 0.5

[atlases.units.grid]
cell_width = 64
cell_height = 64
columns = 8
rows = 8
spacing = 0
margin = 0

# Example named regions
[atlases.units.regions.tank_body]
x = 0
y = 0
width = 64
height = 64

[atlases.units.regions.turret]
x = 64
y = 0
width = 32
height = 32

# Animation clips
[clips.tank_idle]
atlas = "units"
frames = [0, 1, 2, 3]
frame_duration = 0.1
looping = true

[clips.tank_move]
atlas = "units"
frames = [4, 5, 6, 7]
frame_duration = 0.08
looping = true
