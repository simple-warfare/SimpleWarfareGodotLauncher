id = "rw_mvp:schema"
version = 2
status = "parser_target"

[ids]
format = "namespace:name"
namespace = "rw_mvp"
case = "snake_case"

[units]
storage = "array"
required = [
  "id",
  "display",
  "classification",
  "body",
  "movement",
  "economy",
  "vision",
  "render",
  "source",
]
optional = [
  "combat",
  "production",
  "construction",
  "abilities",
  "upgrades",
]

[weapons]
storage = "array"
required = [
  "id",
  "targeting",
  "cooldown",
  "turrets",
  "projectile",
]

[maps]
terrain_encoding = "fixed_width_rows"
terrain_row_alphabet = "single_ascii_tile_code"
initial_entities = "array"

[runtime]
authoritative_rules = "server"
frontend_behavior = "presentation_only"
content_phase = "load_validate_normalize_spawn_plan"
